name: NodeDrops CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.8.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          DATABASE_URL: mysql://ci:ci@127.0.0.1:3306/nodedrops

      - name: Type-check
        run: pnpm type-check
        env:
          DATABASE_URL: mysql://ci:ci@127.0.0.1:3306/nodedrops

      - name: Smoke-test publisher Markdown parser
        run: pnpm exec tsx scripts/test-github-publisher.ts

      - name: Lint
        run: pnpm exec eslint src
